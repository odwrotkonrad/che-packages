# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
#[why] the workspace index inlines each repo's rendered purpose doc: without this the map lists this
#   repo with nothing to say about it. full doc adoption (AGENTS.md, README.md) needs 3-audience
#   templates authored in prose, a separate change
ontoRepo:
  include:
    renderTemplates:
      - source: "git::gitlab.com/konradodwrot/cross-repo/prose/assets@${{ var.PROSE_ASSETS_REF }}"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/che-packages/purpose.md
            dest: assets/docs-agents/purpose.md
##[<] 🤖🤖
