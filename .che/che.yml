# yaml-language-server: $schema=https://gitlab.com/api/v4/projects/konradodwrot%2Fgo-modules/packages/generic/che-schema/v0.0.1-che-min-v0.0.96/che.schema.json
##[>] 🤖🤖
include:
  sources: [.che/repo-git-tracked, .che/repo-git-untracked]

#[why] the repo declares the toolchain its dependency step needs, so no host or image has to carry
#   python in advance for this repo's venv to build
devEnv:
  options:
    autoDiscover: false
  include:
    installPackages:
      - python3
