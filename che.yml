# yaml-language-server: $schema=https://gitlab.com/konradodwrot/go-modules/-/raw/main/che/assets/data/che.schema.json
##[>] 🤖🤖
#[why] the repo declares the toolchain its dependency step needs, so no host or image has to carry
#   python in advance for this repo's venv to build
devEnv:
  include:
    installPackages:
      - python3

#[why] the workspace index inlines each repo's rendered purpose doc: without this the map lists this
#   repo with nothing to say about it. full doc adoption (AGENTS.md, README.md) needs 3-audience
#   templates authored in prose, a separate change
ontoRepo:
  options:
    autoDiscover: true
  include:
    renderTemplates:
      - source: "@gitlab.com/konradodwrot/prose?ref=v0.0.31"
        options:
          skipAutoGeneratedHeader: true
        <<<:
          - source: //repos/che-packages/purpose.md
            dest: assets/docs-agents/purpose.md
##[<] 🤖🤖
