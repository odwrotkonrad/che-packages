workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: .gitlab/ci/install-matrix.gitlab-ci.yml

default:
  tags:
    - gke-linux-amd64
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

stages:
  - validate
  - test-install-auto
  - test-install-manual
  - release
  - publish
  - trigger-downstream

variables:
  #[why] the shared ci-linux image carries no python: this repo is its only python consumer,
  #   so the validate job pulls a stock slim image instead of bloating the shared base
  CI_IMAGE_PY: python:3.13-slim
  CI_IMAGE: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux:latest
  CI_IMAGE_DIND: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux-dind:latest
  CI_IMAGE_DIND_ARM64: registry.gitlab.com/konradodwrot/infra/oci-images/ci-linux-dind:latest-arm64

#[what] fast automatic gate: schema validation plus every entry's methods and verify commands resolving
validate-catalog:
  stage: validate
  image: $CI_IMAGE_PY
  needs: []
  #[why] curl, zsh and make, absent from the stock python image: the schema fetch and the
  #   prerelease resolver need the first two, the script below runs through the third. without
  #   the fetch the schema check skips itself and this job reports success while validating nothing
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates zsh make
  #[why] through make, the same path a local run takes: invoking pytest directly bypassed the
  #   schema fetch, so the job and a maintainer's machine validated different things
  script:
    - make test-catalog

.install-base:
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    #[why] docker run -v paths must live under /builds, the only volume the dind service shares with the job
    E2E_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/che-e2e-install
  needs:
    - job: validate-catalog
  before_script:
    #[why] zsh: the prerelease resolver make runs before fetching
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip python3-venv curl ca-certificates zsh
    - make fetch-che

#[what] automatic coverage: the first CHE_E2E_AUTO_PER_METHOD packages of every install method
#[why] every MR proves each method still installs something real, without a full-catalog matrix
.install-auto:
  extends: .install-base
  stage: test-install-auto
  variables:
    CHE_E2E_TIER: auto
    CHE_E2E_AUTO_PER_METHOD: "1"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" || $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - make test-install-auto TARGET_ARCH=$TARGET_ARCH

test-install-auto-amd64:
  extends: .install-auto
  image: $CI_IMAGE_DIND
  tags:
    - gke-linux-amd64-medium
  variables:
    TARGET_ARCH: amd64

test-install-auto-arm64:
  extends: .install-auto
  image: $CI_IMAGE_DIND_ARM64
  tags:
    - gke-linux-arm64-medium
  variables:
    TARGET_ARCH: arm64

#[what] cut the next release when a catalog change lands on the default branch
#[why] consumers read published releases, never the default branch: go-modules vendors a pinned
#   version and `che packages update` resolves the latest alias, so a merged change nobody tagged
#   reaches no one. glab release create mints the tag and the release together, which is what the
#   publish job's asset links attach to
#[why] the publish scripts are watched alongside the catalog: a fix to what they emit only ships
#   through a tag, and go-modules had exactly this gap leave a broken brew formula published
release-catalog:
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes: [packages.yml, scripts/**/*, ci/publish-packages-defs.zsh, ci/create-tag.zsh, ci/next-tag.zsh]
  script:
    - ci/create-tag.zsh "$CI_COMMIT_SHA"

#[what] tag pipeline: tar packages.yml + scripts for $CI_COMMIT_TAG, publish to the generic package registry with a latest/ alias
publish-definitions:
  stage: publish
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - ci/publish-packages-defs.zsh

#[what] a published catalog reaches the binaries that embed it: go-modules re-vendors at the raised pin
#[why] manual, not automatic: raising che/packages-pin.env is a reviewable change in that repo, not a side effect of tagging here
trigger-go-modules:
  stage: trigger-downstream
  needs: [publish-definitions]
  rules:
    - if: $CI_COMMIT_TAG
      when: manual
      allow_failure: true
  trigger:
    project: konradodwrot/go-modules
    branch: main
