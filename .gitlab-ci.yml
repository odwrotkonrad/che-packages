workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

include:
  - local: .gitlab/ci/install-matrix.gitlab-ci.yml
  - project: konradodwrot/centralized/assets/generic
    ref: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
    file:
      - consumer-repo-config/ci/templates/EmitEvents.gitlab-ci.yml
      - consumer-repo-config/files-generation/templates/FilesTrackedVerify.gitlab-ci.yml
      - consumer-repo-config/ci/templates/UpstreamEnvDrift.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitChanged.gitlab-ci.yml
      - consumer-repo-config/precommit-lefthook/templates/PrecommitAll.gitlab-ci.yml

default:
  tags:
    - gke-linux-amd64-small
  retry:
    max: 2
    when:
      - runner_system_failure
      - api_failure
      - stuck_or_timeout_failure
      - scheduler_failure
      - unknown_failure

stages:
  - validate
  - test-install-manual
  - release
  - publish
  - trigger-downstream

variables:
  #[why] the shared ci-linux image carries no python: this repo is its only python consumer,
  #   so the validate job pulls a stock slim image instead of bloating the shared base
  CI_IMAGE_PY: $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/python:3.13-slim
  ARTIFACT_REGISTRY: $GRP_KO_VAR_ARTIFACT_REGISTRY
  ARTIFACT_REGISTRY_PROXY_DOCKERHUB: $GRP_KO_VAR_ARTIFACT_REGISTRY_PROXY_DOCKERHUB
  OCI_IMAGES_CI_LINUX_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_REF
  OCI_IMAGES_CI_LINUX_DIND_REF: $GRP_KO_VAR_OCI_IMAGES_CI_LINUX_DIND_REF
  CHE_SCHEMA_REF: $GRP_KO_VAR_CHE_SCHEMA_REF
  CENTRALIZED_ASSETS_GENERIC_REF: $GRP_KO_VAR_CENTRALIZED_ASSETS_GENERIC_REF
  AI_TOOLS_CONFIGS_REF: $GRP_KO_VAR_AI_TOOLS_CONFIGS_REF
  CI_IMAGE: $ARTIFACT_REGISTRY/ci-linux:$OCI_IMAGES_CI_LINUX_REF
  CI_IMAGE_DIND: $ARTIFACT_REGISTRY/ci-linux-dind:$OCI_IMAGES_CI_LINUX_DIND_REF
  CI_IMAGE_DIND_ARM64: $ARTIFACT_REGISTRY/ci-linux-dind:$OCI_IMAGES_CI_LINUX_DIND_REF-arm64

#[what] fast automatic gate: schema validation plus every entry's methods and verify commands resolving
validate-catalog:
  #[why] the .repo/ declarations and .env.tpl are on the list so a commit touching only them still
  #   runs a job: a pipeline that creates none is reported as failed, not as nothing to do
  rules:
    - changes:
        - packages.yml
        - scripts/**/*
        - tests/**/*
        - pyproject.toml
        - che-pin.env
        - Makefile
        - .che/**/*
        - .gitlab-ci.yml
        - .repo/*.tpl
        - .repo/deps-graph.yml
        - .repo/upstream.yml
        - .repo/upstream.env
        - .repo/downstream.yml
        - ci/**/*
        - .gitlab/**/*
        - README.md
  stage: validate
  image: $CI_IMAGE_PY
  needs: []
  #[why] curl, zsh and make, absent from the stock python image: the schema fetch and the
  #   prerelease resolver need the first two, the script below runs through the third. without
  #   the fetch the schema check skips itself and this job reports success while validating nothing
  before_script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends curl ca-certificates zsh make
  #[why] through make, the same path a local run takes: invoking pytest directly bypassed the
  #   schema fetch, so the job and a maintainer's machine validated different things
  script:
    - make test-catalog

.install-base:
  services:
    - name: $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/docker:dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    #[why] docker run -v paths must live under /builds, the only volume the dind service shares with the job
    E2E_INSTALL_CACHE_DIR: $CI_PROJECT_DIR/.cache/che-e2e-install
    CHE_E2E_BASE_IMAGE: $ARTIFACT_REGISTRY_PROXY_DOCKERHUB/library/debian:bookworm-slim
  needs:
    - job: validate-catalog
      optional: true
  before_script:
    #[why] zsh: the prerelease resolver make runs before fetching
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends python3-pip python3-venv curl ca-certificates zsh
    - make fetch-che

#[what] cut the next release when a catalog change lands on the default branch
#[why] consumers read published releases, never the default branch: go-modules vendors a pinned
#   version and `che packages update` resolves the latest alias, so a merged change nobody tagged
#   reaches no one. glab release create mints the tag and the release together, which is what the
#   publish job's asset links attach to
#[why] the publish scripts are watched alongside the catalog: a fix to what they emit only ships
#   through a tag, and go-modules had exactly this gap leave a broken brew formula published
release-catalog:
  stage: release
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        - packages.yml
        - scripts/**/*
        - ci/publish-packages-defs.zsh
        - ci/create-tag.zsh
        - ci/next-tag.zsh
  script:
    - ci/create-tag.zsh "$CI_COMMIT_SHA"

#[what] tag pipeline: tar packages.yml + scripts for $CI_COMMIT_TAG, publish to the generic package registry with a latest/ alias
publish-definitions:
  stage: publish
  image: $CI_IMAGE
  needs: []
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - packages.yml
        - scripts/**/*
        - ci/**/*
  script:
    - ci/publish-packages-defs.zsh

#[what] a published catalog reaches the binaries that embed it: go-modules re-vendors at the raised pin
#[why] manual, not automatic: adopting a newer catalog is a reviewable act, not a side effect of tagging here
trigger-go-modules:
  stage: trigger-downstream
  needs:
    - publish-definitions
  rules:
    - if: $CI_COMMIT_TAG
      changes:
        - packages.yml
        - scripts/**/*
      when: manual
      allow_failure: true
  trigger:
    project: konradodwrot/go-modules
    branch: main

#[what] the published version reaches the pin every consumer's CI reads: control evaluates the graph and drives the raise of the CHE_PACKAGES_REF group CI variable in infra/iac
#[why] control, not infra/iac directly: control already owns the dependency graph and knows which
#   repos consume the catalog, so onboarding a consumer stays an edit to that repo's own interface
#   file rather than a hardcoded trigger here
emit-events:
  extends: .emit-events
  stage: trigger-downstream

