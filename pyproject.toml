[project]
name = "che-packages-tests"
version = "0.0.0"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-ra -s"
markers = []
